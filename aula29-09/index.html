<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo interativo</title>
    <link rel="stylesheet" href="style.css"
</head>
<body>
<header>
    <h1>Catálogo interativo</h1>
    <p>Cadastre novos produtos  utilizando JavaScript e DOM</p>

</header>  
<main>
    <section class="formulario">
        <h2>Cadastrar Produto</h2>
        <label for="nome">Nome do produto</label>
        <input type="text" id="nome" placeholder="Digite o nome do produto">
        <label for="categoria">Categoria</label>
        <input type="text" id="categoria" placeholder="Digite a acategoria">
        <label for="preco">preço</label>
        <input type="number" id="preco" placeholder="digite o preço">
        <label for="descricao">descrição</label>
        <textarea id="descricao" placeholder="digite a descrição do produto"></textarea>
        <div class="botoes">
            <button type="button" id="visualizar">Visualizar</button>
            <button type="button" id="adicionar">Adicionar Catálogo</button>
        </div>
        <p id="mensagemErro"></p>
    </section>

    <section class="previa">
        <h2>Pré-visualização</h2>
        <div class="card">
            <h3 id="visualNome">Nome do Produto</h3>
            <p id="visualCategoria">Categoria</p>
            <p id="visualPreco">R$ 0,00</p>
            <p id="visualDescricao">Descrição do Produto</p>
        </div>
    </section>

    <section class="catalogo">
        <h2>Produtos Cadastrados</h2>
        <div id="listaItens"></div>
    </section>

</main>
<footer>
    <p>&copy; 2026 - Catálogo interativo</p>

</footer>
<script src="script.js"></script> 

</body>
</html>
